services:
  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://qa:${POSTGRES_PASSWORD:-qa_password}@postgres:5432/${POSTGRES_DB:-qa}
      REDIS_URL: redis://redis:6379/0
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://qa:${POSTGRES_PASSWORD:-qa_password}@postgres:5432/${POSTGRES_DB:-qa}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build: .
    command: python -m app.scheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://qa:${POSTGRES_PASSWORD:-qa_password}@postgres:5432/${POSTGRES_DB:-qa}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qa_password}
      POSTGRES_DB: ${POSTGRES_DB:-qa}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d ${POSTGRES_DB:-qa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:

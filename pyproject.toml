[project]
name = "qa-backend"
version = "0.1.0"
description = "FastAPI Q&A API with PostgreSQL persistence and Redis caching"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg==0.30.0",
    "fastapi==0.115.6",
    "pydantic-settings==2.7.1",
    "redis==5.2.1",
    "sqlalchemy[asyncio]==2.0.36",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]

